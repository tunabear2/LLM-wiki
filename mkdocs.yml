          - SIGnature: papers/goldScoringGeneImportance2026.md
          - Causal Circuit Tracing: papers/kendiukhovCausalCircuitTracing2026.md
          - scGPT Bayesian HPO: papers/tayBayesianHyperparameterOptimization2026.md
