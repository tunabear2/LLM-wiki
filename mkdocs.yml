          - Smart-seq2: papers/picelliSmartSeq2Sensitive2013.md
          - Drop-seq: papers/macoskoDropSeq2015.md
          - Seurat Spatial Reconstruction: papers/satijaSpatialReconstruction2015.md
          - Spatial Transcriptomics: papers/stahlSpatialTranscriptomics2016.md
          - CITE-seq: papers/stoeckiusCITESeq2017.md
          - Scanpy: papers/wolfSCANPY2018.md
          - scVI: papers/lopezDeepGenerativeSingleCell2018.md
          - Harmony: papers/korsunskyHarmony2019.md
  - Articles:
      - Article / Report Scraps: articles/index.md
      - Bulk RNA-Seq Foundation Model Benchmark: articles/2026-05-27-bulk-rnaseq-foundation-model-benchmark.md
  - Bio AI:
      - scGPT: bio-ai/scgpt.md
      - Geneformer: bio-ai/geneformer.md
      - Transcriptomics: bio-ai/transcriptomics.md
      - Single-cell LLM: bio-ai/single-cell-llm.md
  - Code:
      - Code Log:
          - Overview: code/code-log.md
          - LLM-wiki Deploy: code/logs/2026-05-18-llm-wiki-deploy.md
          - scGPT Domain Transfer: code/logs/2026-05-18-scgpt-domain-transfer.md
          - scGPT Rejection Worklog: code/logs/2026-05-20-scgpt-rejection-worklog.md
