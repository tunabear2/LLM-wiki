site_name: LLM Bio Wiki
site_description: Personal wiki for LLM, Transformer, bioinformatics, and single-cell foundation models
site_author: tuna bear
site_url: https://tunabear2.github.io/LLM-wiki/

exclude_docs: |
  _templates/*
  papers/template.md
  LLM-wiki/*

hooks:
  - hooks/strip_obsidian_comments.py

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Research Questions: research-questions.md
  - LLM Basics:
      - Overview: llm/overview.md
      - Transformer: llm/transformer.md
      - Attention: llm/attention.md
      - Tokenizer: llm/tokenizer.md
      - Fine-tuning: llm/fine-tuning.md
  - Papers:
      - Paper Notes: papers/index.md
      - Attention Is All You Need: papers/vaswaniAttentionAllYou2023.md
      - Transformer: papers/transformer.md
      - BERT: papers/bert.md
      - GPT: papers/gpt.md
      - Single-cell Foundation Models: papers/single-cell-foundation-models.md
  - Bio AI:
      - scGPT: bio-ai/scgpt.md
      - Geneformer: bio-ai/geneformer.md
      - Transcriptomics: bio-ai/transcriptomics.md
      - Single-cell LLM: bio-ai/single-cell-llm.md
  - Code:
      - PyTorch: code/pytorch.md
      - Hugging Face: code/huggingface.md
      - RAG: code/rag.md
  - Glossary:
      - Terms: glossary/terms.md
  - Workflows:
      - Zotero + Obsidian: workflows/zotero-obsidian.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
