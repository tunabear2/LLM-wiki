site_name: LLM Bio Wiki
site_description: Personal wiki for LLM, Transformer, bioinformatics, and single-cell foundation models
site_author: tuna bear
site_url: https://tunabear2.github.io/LLM-wiki/

exclude_docs: |
  _templates/*
  papers/template.md
  LLM-wiki/*

hooks:
  - hooks/strip_obsidian_comments.py

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Research Questions: research-questions.md
  - Reports:
      - Kidney Transplant Rejection: reports/kidney-transplant-rejection-classification-summary.md
      - Transplant Prognosis Model Notes: reports/transplant-prognosis-model-notes.md
      - Microarray-to-scRNA Prognosis Adapter: reports/microarray-to-scrna-prognosis-adapter.md
      - scGPT Prognosis Progress 2026-06-16: reports/scgpt-prognosis-progress-2026-06-16.md
      - scGPT Worklog Summary: reports/scgpt-worklog-summary.md
      - Single-cell FM Paper Watch 2026-06-08: reports/single-cell-fm-paper-watch-2026-06-08.md
  - LLM Basics:
      - Overview: llm/overview.md
      - Transformer: llm/transformer.md
      - Attention: llm/attention.md
      - Tokenizer: llm/tokenizer.md
      - Fine-tuning: llm/fine-tuning.md
  - Papers:
      - Paper Notes: papers/index.md
      - Attention Is All You Need: papers/vaswaniAttentionAllYou2023.md
      - Transformer: papers/transformer.md
      - BERT: papers/bert.md
      - GPT: papers/gpt.md
      - Single-cell Foundation Models: papers/single-cell-foundation-models.md
      - TxFM: papers/kenyonDeanEffectiveBiologicalRepresentation2026.md
      - SIGnature: papers/goldScoringGeneImportance2026.md
      - Causal Circuit Tracing: papers/kendiukhovCausalCircuitTracing2026.md
      - scGPT Bayesian HPO: papers/tayBayesianHyperparameterOptimization2026.md
      - Single-cell LLM Learnability: papers/yanEvaluatingLearnabilitySingleCell2026.md
      - GeneBag: papers/liangGeneBagTrainingCell2024.md
      - Path-GPTOmic: papers/PathGPTOmicBalancedMultimodal.md
      - HEIMDALL: papers/haberHEIMDALLDisentanglingTokenizer2026.md
      - USHER: papers/pratapaUSHERGuidingFoundation2025.md
      - EGSP Survival Prediction: papers/liuLeveragingSinglecellFoundation2026.md
      - COIN Drug Sensitivity: papers/shangguanDrugSensitivityInference2025.md
      - RNA-Seq vs Microarray: papers/zhaoComparisonRNASeqMicroarray2014.1.16..md
  - Articles:
      - Article / Report Scraps: articles/index.md
      - Bulk RNA-Seq Foundation Model Benchmark: articles/2026-05-27-bulk-rnaseq-foundation-model-benchmark.md
  - Bio AI:
      - scGPT: bio-ai/scgpt.md
      - Geneformer: bio-ai/geneformer.md
      - Transcriptomics: bio-ai/transcriptomics.md
      - Single-cell LLM: bio-ai/single-cell-llm.md
  - Code:
      - Code Log:
          - Overview: code/code-log.md
          - LLM-wiki Deploy: code/logs/2026-05-18-llm-wiki-deploy.md
          - scGPT Domain Transfer: code/logs/2026-05-18-scgpt-domain-transfer.md
          - scGPT Rejection Worklog: code/logs/2026-05-20-scgpt-rejection-worklog.md
          - scGPT Rejection End-to-End v1/v2: code/logs/2026-05-22-scgpt-rejection-end2end-v1-v2.md
          - scGPT Rejection End-to-End v3/v4: code/logs/2026-05-26-scgpt-rejection-end2end-v3-v4.md
          - Prognosis Microarray Adapter: code/logs/2026-06-01-prognosis-microarray-adapter.md
          - scGPT Full Worklog: code/logs/2026-06-04-scgpt-worklog.md
          - scGPT Prognosis Worklog 2026-06-16: code/logs/2026-06-16-scgpt-prognosis-worklog.md
          - Sessions Log 2026-06-16: code/logs/2026-06-16-sessions-log.md
      - PyTorch: code/pytorch.md
      - Hugging Face: code/huggingface.md
      - RAG: code/rag.md
  - Glossary:
      - Terms: glossary/terms.md
  - Workflows:
      - Zotero + Obsidian: workflows/zotero-obsidian.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - fenced_code
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
