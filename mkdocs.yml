          - scGPT Full Worklog: code/logs/2026-06-04-scgpt-worklog.md
          - scGPT Prognosis Worklog 2026-06-16: code/logs/2026-06-16-scgpt-prognosis-worklog.md
          - Sessions Log 2026-06-16: code/logs/2026-06-16-sessions-log.md
