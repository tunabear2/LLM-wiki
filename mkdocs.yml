  - Workflows:
      - Zotero + Obsidian: workflows/zotero-obsidian.md
      - Obsidian LLM/RAG: workflows/obsidian-llm-rag.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables
  - fenced_code
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

extra_css:
  - stylesheets/warm-research-wiki.css?v=20260811

extra_javascript:
  - javascripts/warm-research-wiki.js
