site_name: LLM Bio Wiki
site_description: Personal wiki for LLM, Transformer, bioinformatics, and single-cell foundation models
site_author: tuna bear
site_url: https://tunabear2.github.io/LLM-wiki/

exclude_docs: |
  _templates/*
  copilot/**
  rag/**
  code/rag-sources/**
  papers/template.md
  LLM-wiki/*

hooks:
  - hooks/strip_obsidian_comments.py

theme:
  name: material
  custom_dir: overrides
  language: ko
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Research Questions: research-questions.md
  - Reports:
      - Kidney Transplant Rejection: reports/kidney-transplant-rejection-classification-summary.md
      - Transplant Prognosis Model Notes: reports/transplant-prognosis-model-notes.md
      - Microarray-to-scRNA Prognosis Adapter: reports/microarray-to-scrna-prognosis-adapter.md
      - scGPT Prognosis Progress 2026-06-16: reports/scgpt-prognosis-progress-2026-06-16.md
      - scGPT Worklog Summary: reports/scgpt-worklog-summary.md
      - Single-cell FM Paper Watch 2026-06-08: reports/single-cell-fm-paper-watch-2026-06-08.md
  - LLM Basics:
      - Overview: llm/overview.md
      - Transformer: llm/transformer.md
      - Attention: llm/attention.md
      - Tokenizer: llm/tokenizer.md
      - Fine-tuning: llm/fine-tuning.md
  - Papers:
      - Paper Notes: papers/index.md
      - Sequencing Analysis:
          - Bulk RNA-seq Analysis: papers/bulk-rna-seq.md
          - Bulk RNA-seq Core Papers:
              - STAR: papers/dobinSTARUltrafast2013.md
              - kallisto: papers/brayKallistoNearOptimal2016.md
              - Salmon: papers/patroSalmonFast2017.md
              - TMM Normalization: papers/robinsonScalingNormalization2010.md
              - DESeq2: papers/loveDESeq2Moderated2014.md
              - voom-limma: papers/lawVoomPrecision2014.md
          - scRNA-seq Analysis: papers/scrna-seq.md
          - scRNA-seq Core Papers:
              - scran Normalization: papers/lunPoolingNormalizeSingleCell2016.md
              - Seurat Integration: papers/stuartComprehensiveIntegration2019.md
              - Seurat WNN: papers/haoIntegratedMultimodalSingleCell2021.md
          - DNA-seq / Variant Analysis: papers/dna-seq-analysis.md
          - DNA-seq Core Papers:
              - BWA: papers/liBWAFast2009.md
              - SAMtools: papers/liSAMtools2009.md
              - GATK Best Practices: papers/vanDerAuweraGATKBestPractices2013.md
              - FreeBayes: papers/garrisonFreeBayes2012.md
              - Manta: papers/chenMantaRapid2016.md
              - Ensembl VEP: papers/mclarenVEP2016.md
      - Array / Association Analysis:
